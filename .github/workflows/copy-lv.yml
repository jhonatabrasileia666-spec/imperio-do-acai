name: Copy Delivery LV base

on:
  push:
    paths:
      - ".github/workflows/copy-lv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone LV projects
        run: |
          git clone --depth 1 https://github.com/jhonatabrasileia666-spec/deliverylv.git /tmp/deliverylv
          git clone --depth 1 https://github.com/jhonatabrasileia666-spec/deliverylv-adm.git /tmp/deliverylv-adm

      - name: Replace target with complete LV copy
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/deliverylv/ ./
          mkdir -p admin
          rsync -a --exclude='.git' --exclude='.github' /tmp/deliverylv-adm/ ./admin/

      - name: Commit complete copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Copia completa do Delivery LV e painel ADM"
            git push origin HEAD:main
          fi
