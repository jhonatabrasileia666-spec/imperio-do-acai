<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6f275f"><title>Império do Açaí | Painel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="https://unpkg.com/lucide@0.468.0"></script>
<style>
:root{--p:#70245f;--g:#159c63;--o:#ff6f18;--cream:#fff0cf;--bg:#f7f3ed;--ink:#30152d;--muted:#796777;--line:#e7d8c3;--red:#b84050}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui}.hidden{display:none!important}button,input,select{font:inherit}button{border:0;cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;padding:28px;border-radius:24px;border:1px solid var(--line);box-shadow:0 20px 50px #70245f15}.login-card h1{font:800 31px/1 Fraunces,serif;color:var(--p);margin:0 0 7px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 18px}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin:6px 0;background:#fff}.primary{width:100%;padding:13px;border-radius:11px;background:var(--p);color:#fff;font-weight:800;margin-top:8px}
.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 20px;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;border-radius:50%;object-fit:cover}.brand strong{font:800 18px/1 Fraunces,serif;color:var(--p)}.brand small{display:block;color:var(--g);font-size:10px;font-weight:800}.logout{padding:9px 12px;border-radius:10px;background:var(--cream);color:var(--p);font-weight:800}
.layout{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:auto;min-height:calc(100vh - 69px)}.side{padding:18px;border-right:1px solid var(--line);background:#fff}.nav{width:100%;display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;background:transparent;color:var(--muted);font-weight:800;text-align:left;margin-bottom:5px}.nav.active{background:var(--p);color:#fff}.content{padding:24px}.view{display:none}.view.active{display:block}.title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.title h2{margin:0;font:800 30px/1 Fraunces,serif;color:var(--p)}.title p{margin:5px 0 0;color:var(--muted);font-size:12px}.refresh{padding:9px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--p);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.metric small{color:var(--muted);font-weight:700}.metric strong{display:block;margin-top:7px;font:800 29px/1 Fraunces,serif;color:var(--p)}.list{display:grid;gap:10px;margin-top:17px}.order,.product{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.order-head,.product{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.order h3,.product h3{margin:0;color:var(--p)}.order p,.product p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.4}.order-items{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11px;line-height:1.55}.status-select,.price-input{padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#fff}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--cream);color:var(--p);font-size:10px;font-weight:900}.toggle{padding:8px 10px;border-radius:9px;font-size:10px;font-weight:900;background:#e9f6ee;color:var(--g)}.toggle.off{background:#fde9e9;color:var(--red)}.product-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.price-input{width:90px}.search{width:min(340px,100%);padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--ink);color:#fff;padding:11px 14px;border-radius:11px;font-size:11px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:sticky;top:69px;z-index:15;display:flex;gap:7px;overflow:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.nav{width:auto;flex:none;margin:0}.content{padding:16px}.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section class="login" id="login"><div class="login-card"><h1>Império do Açaí</h1><p>Painel administrativo conectado ao sistema.</p><input class="input" id="email" type="email" placeholder="E-mail"><input class="input" id="password" type="password" placeholder="Senha"><button class="primary" id="login-btn">Entrar</button></div></section>
<section class="app hidden" id="app"><header class="top"><div class="brand"><img id="logo"><div><strong>Império do Açaí</strong><small>Painel administrativo</small></div></div><button class="logout" id="logout">Sair</button></header>
<div class="layout"><aside class="side"><button class="nav active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Resumo</button><button class="nav" data-view="orders"><i data-lucide="receipt-text"></i>Pedidos</button><button class="nav" data-view="menu"><i data-lucide="utensils"></i>Cardápio</button></aside>
<main class="content">
<section class="view active" id="view-dashboard"><div class="title"><div><h2>Resumo</h2><p>Visão rápida da operação.</p></div><button class="refresh" data-refresh>Atualizar</button></div><div class="cards" id="metrics"></div><div class="list" id="recent-orders"></div></section>
<section class="view" id="view-orders"><div class="title"><div><h2>Pedidos</h2><p>Novos, preparo, prontos, entrega e finalizados.</p></div><button class="refresh" data-refresh>Atualizar</button></div><div class="list" id="orders-list"></div></section>
<section class="view" id="view-menu"><div class="title"><div><h2>Cardápio</h2><p>Ative, desative e altere os preços.</p></div><input class="search" id="search" placeholder="Buscar produto..."></div><div class="list" id="products-list"></div></section>
</main></div></section><div class="toast" id="toast"></div><script src="./admin.js?v=20260927-1"></script></body></html>
